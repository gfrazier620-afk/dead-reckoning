<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dead Reckoning</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="title-bar">
  <h1>DEAD RECKONING</h1>
  <p id="status-line">day 1 — arrow keys / WASD to move</p>
</div>

<div id="game-container"></div>

<div id="health-bar-wrap">
  <div id="health-bar"><div id="health-fill"></div></div>
  <span id="health-label">100 / 100</span>
</div>

<div id="hud">
  <div id="resource-hud">Wood: 0   Food: 0   Scrap: 0</div>
  <div id="hint-line">Gather with E. Build with B. Attack nearby zombies with Space.</div>
</div>

<div id="build-menu">
  <div class="build-option selected" data-build="wall">
    <span class="key">1</span> Wall <span class="cost">3 wood</span>
  </div>
  <div class="build-option" data-build="bed">
    <span class="key">2</span> Bed <span class="cost">4 wood, 1 scrap</span>
  </div>
  <div class="build-hint">Click a tile near you to place it. Press B to exit build mode.</div>
</div>

<div id="roster-panel">
  <div id="roster-header">Survivors rescued: <span id="roster-count">0</span></div>
  <div id="roster-list">
    <div class="roster-empty">No survivors rescued yet.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
